# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `dev`, so the workflow had never run on a push to it.
#   - the test job ran the starter's placeholder echo, so a green check proved
#     only that the runner could print a sentence. Replaced with
#     scripts/ci-smoke-test.js, added by repocurator: package.json's own
#     "test" script is `tsc --watch`, which never exits and so cannot be a CI
#     step, and there was no other test in the repository.
#   - `yarn build` failed on every GitHub-hosted Ubuntu image (22.04 and
#     24.04 alike): next@12.2.1's prebuilt @next/swc-linux-x64-gnu binary
#     dynamically links libssl.so.1.1, which Ubuntu dropped after 20.04
#     (retired by GitHub Actions in 2025) -- there is nothing for apt to
#     install, on this runner or the next one. next falls back to an
#     on-demand WASM build when the native binary won't load, but its
#     downloader mis-builds the request URL from this runner's
#     `npm config get registry` (it produces
#     `https://registry.yarnpkg.com@next/swc-wasm-nodejs/...`, which resolves
#     to host `next` and fails DNS), so that fallback failed too. Added the
#     "Ensure the SWC WASM fallback is present" step below, which installs
#     the WASM build into node_modules ahead of time so next finds it
#     directly and never calls that downloader.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

      # Add your project's linters below this line.

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Ensure the SWC WASM fallback is present
        # See the workflow header comment: this runner has no way to satisfy
        # next@12.2.1's native SWC binary, and next's own on-demand WASM
        # download is broken on it too. `yarn add` here only touches this
        # job's node_modules -- nothing is committed back to the repository.
        run: yarn add --dev @next/swc-wasm-nodejs@12.2.1

      - name: Build
        run: yarn build

      - name: Test
        run: node scripts/ci-smoke-test.js
